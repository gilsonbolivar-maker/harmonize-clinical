# Deploy do Harmonize Clinical no Netlify.
#
# Este ambiente de desenvolvimento não alcança a rede do Netlify (a política de
# egresso recusa netlify.com), então o deploy roda aqui, no runner do GitHub,
# que tem rede liberada. O agente dispara este workflow e lê os logs pela API
# do Actions — o token do Netlify fica só nos secrets do repositório.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN  obrigatório  Personal access token do Netlify
#   NETLIFY_SITE_ID     opcional     Sobrepõe o site padrão fixado no job
#   GEMINI_API_KEY      opcional     Só para o comando sync-env

name: Netlify

# Sem gatilho em push: quem publica a cada commit é a integração nativa do
# Netlify com o GitHub. Se este workflow também rodasse em push, cada commit
# geraria dois builds concorrentes do mesmo site.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "O que fazer"
        type: choice
        default: status
        options:
          - deploy-prod
          - deploy-preview
          - status
          - sync-env

# Deploys não podem correr em paralelo: dois builds publicando ao mesmo tempo
# deixam o site num estado imprevisível. Não cancelamos o que já está rodando —
# um deploy interrompido no meio é pior que um deploy a mais.
concurrency:
  group: netlify-deploy
  cancel-in-progress: false

jobs:
  netlify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COMMAND: ${{ inputs.command }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      # O Site ID identifica o site, mas não autoriza nada — sozinho não serve
      # para ninguém, e a API do Netlify o expõe em URLs. Fica aqui em claro
      # para o repositório precisar de um único secret. O secret, se existir,
      # tem precedência: é o caminho para apontar o workflow para outro site
      # sem reescrever o arquivo.
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || '6d1bc2b5-3922-4e5a-8933-938de4d7b58f' }}

    steps:
      # Existir e valer são coisas diferentes: um token revogado, truncado na
      # cópia ou de outra conta passa na checagem de presença e só falha lá na
      # frente, com um 401 cru no meio de outro comando. Estas duas chamadas
      # separam as três causas antes de qualquer trabalho.
      - name: Conferir o token e o site
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Secret NETLIFY_AUTH_TOKEN ausente — cadastre em Settings → Secrets and variables → Actions."
            exit 1
          fi

          codigo() {
            curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/$1"
          }

          http=$(codigo "user")
          if [ "$http" = "401" ]; then
            echo "::error::O Netlify recusou o token (401). Ele foi revogado, copiado incompleto ou é de outra conta. Gere um novo em app.netlify.com/user/applications e atualize o secret NETLIFY_AUTH_TOKEN."
            exit 1
          elif [ "$http" != "200" ]; then
            echo "::error::A API do Netlify respondeu $http ao validar o token."
            cat /tmp/resp.json || true
            exit 1
          fi
          echo "Token válido — conta: $(jq -r '.email // .full_name // .id' /tmp/resp.json)"

          http=$(codigo "sites/$NETLIFY_SITE_ID")
          if [ "$http" = "404" ]; then
            echo "::error::Site $NETLIFY_SITE_ID não encontrado (404). O ID está errado ou pertence a uma conta que este token não alcança."
            exit 1
          elif [ "$http" != "200" ]; then
            echo "::error::A API do Netlify respondeu $http ao buscar o site."
            cat /tmp/resp.json || true
            exit 1
          fi
          echo "Site encontrado: $(jq -r '.name' /tmp/resp.json)"

          echo "Comando: $COMMAND"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # O projeto versiona bun.lock, não package-lock.json (o .gitignore
      # descarta o segundo de propósito), então `npm ci` não se aplica.
      - name: Instalar dependências
        if: env.COMMAND != 'status' && env.COMMAND != 'sync-env'
        run: npm install --no-audit --no-fund

      # O `status` fala direto com a API REST via curl, então não precisa do CLI
      # — que leva mais de um minuto para instalar.
      - name: Instalar o Netlify CLI
        if: env.COMMAND != 'status'
        run: npm install -g netlify-cli --no-audit --no-fund

      - name: Verificar tipos
        if: startsWith(env.COMMAND, 'deploy')
        run: npm run lint

      # --build faz o CLI ler o netlify.toml e rodar o mesmo comando de build da
      # produção, publicando dist/ junto com as functions de netlify/functions.
      #
      # O site alvo vem de NETLIFY_SITE_ID no ambiente, que o CLI lê sozinho.
      # Passar --site seria repetir a aposta que já falhou no `status`.
      - name: Deploy de produção
        if: env.COMMAND == 'deploy-prod'
        run: netlify deploy --build --prod

      - name: Deploy de preview
        if: env.COMMAND == 'deploy-preview'
        run: netlify deploy --build

      # Os deploys disparados pela integração nativa do Netlify não aparecem no
      # Actions. Listá-los aqui é o que dá visibilidade sobre eles — inclusive
      # a mensagem de erro de um build que falhou lá.
      #
      # Tudo via API REST: `netlify status` opera sobre o site linkado e não
      # aceita --site, e depender do estado de link num runner efêmero é frágil.
      - name: Status do site
        if: env.COMMAND == 'status'
        run: |
          api() {
            curl -sS --fail-with-body --max-time 30 \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/$1"
          }

          echo "=== site ==="
          site=$(api "sites/$NETLIFY_SITE_ID")
          echo "$site" | jq -r '
            "nome:    \(.name)",
            "url:     \(.ssl_url // .url)",
            "conta:   \(.account_slug // .account_name // "-")",
            "repo:    \(.build_settings.repo_url // "sem repositório conectado")",
            "branch:  \(.build_settings.repo_branch // "-")",
            "comando: \(.build_settings.cmd // "-")",
            "publica: \(.build_settings.dir // "-")"
          '

          echo
          echo "=== últimos deploys ==="
          api "sites/$NETLIFY_SITE_ID/deploys?per_page=10" \
            | jq -r '.[] | "\(.created_at)  \(.state)  \(.branch // "-")  \(.error_message // "")"'

          echo
          echo "=== variáveis de ambiente ==="
          conta=$(echo "$site" | jq -r '.account_slug // empty')
          if [ -n "$conta" ]; then
            api "accounts/$conta/env?site_id=$NETLIFY_SITE_ID" \
              | jq -r '.[] | "\(.key)  (contextos: \([.values[].context] | join(", ")))"' \
              || echo "não foi possível listar"
          else
            echo "conta não identificada no retorno do site"
          fi

          echo
          echo "=== o site está no ar? ==="
          url=$(echo "$site" | jq -r '.ssl_url // .url')
          echo "GET $url/api/health"
          curl -sS --max-time 20 "$url/api/health" || echo "sem resposta"

      # Mantém a chave do Gemini nos secrets do GitHub como fonte única, em vez
      # de duplicada no painel do Netlify.
      - name: Sincronizar GEMINI_API_KEY para o Netlify
        if: env.COMMAND == 'sync-env'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Secret GEMINI_API_KEY não cadastrado no repositório."
            exit 1
          fi
          netlify env:set GEMINI_API_KEY "$GEMINI_API_KEY"
          echo "Chave enviada. Rode deploy-prod para o site passar a usá-la."

      - name: Conferir se o site respondeu
        if: startsWith(env.COMMAND, 'deploy')
        run: |
          url=$(curl -sS --max-time 30 \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" | jq -r '.ssl_url // .url')
          echo "Site: $url"
          echo "### Deploy concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: $url" >> "$GITHUB_STEP_SUMMARY"

          # O health check confirma que as functions subiram: se /api/health cair
          # na regra de SPA, a resposta vem como HTML em vez do JSON.
          resposta=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors "$url/api/health" || true)
          echo "/api/health -> $resposta"
          if echo "$resposta" | grep -q '"status":"ok"'; then
            echo "- /api/health: ok" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- /api/health: **falhou** (functions podem não ter subido)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::/api/health não devolveu o JSON esperado."
          fi
