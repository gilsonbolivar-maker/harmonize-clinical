# Publica o front estático no GitHub Pages.
#
# O Express de server.ts não sobe aqui: o Pages só recebe o dist/ do Vite.
# Prontuário, agenda, mapa, estoque e financeiro rodam no navegador.
# As rotas /api/* (IA) ficam no Netlify ou no `npm start` local.
#
# O dono precisa, uma vez: Settings → Pages → Source: GitHub Actions.
# URL: https://gilsonbolivar-maker.github.io/harmonize-clinical/

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # O projeto versiona bun.lock, não package-lock.json.
      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Build estático
        run: npm run build:web
        env:
          BASE_PATH: /harmonize-clinical/

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
